<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Web VR 360</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Thay LINK_MP4_CHINH_XAC bằng link có đuôi .mp4 -->
        <video id="video360" src="LINK_MP4_CHINH_XAC" autoplay loop crossorigin="anonymous" playsinline></video>
      </a-assets>
      
      <!-- Fix lỗi S22 Ultra ở đây -->
      <a-camera fov="80" position="0 0 0"></a-camera>
      
      <a-videosphere src="#video360"></a-videosphere>
    </a-scene>
  </body>
</html>
